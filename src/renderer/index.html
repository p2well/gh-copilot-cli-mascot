<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>Copilot CLI Mascot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Character module: an original robot mascot (SVG). Expression/animation is
         driven by the .state-* class on #mascot, set by renderer.js. -->
    <div id="mascot" class="state-idle" title="Copilot CLI mascot (drag to move)">
      <svg class="robot" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-label="robot mascot">
        <!-- antenna -->
        <line class="antenna-stem" x1="50" y1="22" x2="50" y2="10" />
        <circle class="antenna-bulb" cx="50" cy="7" r="4" />

        <!-- head -->
        <rect class="head" x="22" y="22" width="56" height="42" rx="13" />

        <!-- face front (screen, eyes, mouth) — wrapped so the "turn around"
             activity can hide it and reveal the back panel while edge-on. -->
        <g class="face-front">
          <!-- face screen -->
          <rect class="face" x="28" y="28" width="44" height="30" rx="8" />

          <!-- eyes: normal -->
          <g class="eyes eyes-normal">
            <circle class="eye-white" cx="40" cy="42" r="6" />
            <circle class="eye-white" cx="60" cy="42" r="6" />
            <circle class="pupil" cx="40" cy="42" r="2.6" />
            <circle class="pupil" cx="60" cy="42" r="2.6" />
          </g>
          <!-- eyes: happy (done) -->
          <g class="eyes eyes-happy">
            <path d="M35 44 q5 -6 10 0" />
            <path d="M55 44 q5 -6 10 0" />
          </g>
          <!-- eyes: error (X) -->
          <g class="eyes eyes-error">
            <line x1="36" y1="38" x2="44" y2="46" />
            <line x1="44" y1="38" x2="36" y2="46" />
            <line x1="56" y1="38" x2="64" y2="46" />
            <line x1="64" y1="38" x2="56" y2="46" />
          </g>

          <!-- mouth -->
          <path id="mouth" d="M42 52 h16" />
        </g>

        <!-- back panel (shown only during the "turn around" activity) -->
        <g class="face-back">
          <rect class="back-plate" x="28" y="28" width="44" height="30" rx="8" />
          <line class="back-vent" x1="34" y1="36" x2="66" y2="36" />
          <line class="back-vent" x1="34" y1="42" x2="66" y2="42" />
          <line class="back-vent" x1="34" y1="48" x2="66" y2="48" />
          <circle class="back-screw" cx="33" cy="32" r="1.3" />
          <circle class="back-screw" cx="67" cy="32" r="1.3" />
          <circle class="back-screw" cx="33" cy="54" r="1.3" />
          <circle class="back-screw" cx="67" cy="54" r="1.3" />
        </g>

        <!-- thinking dots -->
        <g class="think-dots">
          <circle cx="69" cy="21" r="1.6" />
          <circle cx="77" cy="14" r="2.8" />
          <circle cx="86" cy="7" r="4" />
        </g>

        <!-- body -->
        <rect class="body" x="30" y="66" width="40" height="34" rx="9" />
        <!-- status light / core -->
        <circle class="core" cx="50" cy="83" r="5" />
        <!-- arms -->
        <rect class="arm arm-left" x="18" y="72" width="8" height="18" rx="4" />
        <rect class="arm arm-right" x="74" y="72" width="8" height="18" rx="4" />

        <!-- idle-activity props: drawn objects (no emoji/text captions), hidden by
             default and revealed by the matching .activity-* class. Placed last so
             objects render on top of the robot. -->
        <!-- sleepy "z z z" -->
        <g class="prop prop-zzz">
          <text x="69" y="30" class="zzz z1">z</text>
          <text x="78" y="21" class="zzz z2">z</text>
          <text x="87" y="13" class="zzz z3">z</text>
        </g>
        <!-- music note (whistle), drawn from shapes -->
        <g class="prop prop-note">
          <ellipse class="note-head" cx="72" cy="27" rx="3.2" ry="2.4" transform="rotate(-20 72 27)" />
          <line class="note-stem" x1="75" y1="26" x2="75" y2="13" />
          <path class="note-flag" d="M75 13 q5 1 4 6" />
        </g>
        <!-- sweat drop (bored/sigh) -->
        <path class="prop prop-sweat" d="M74 30 q3 5 0 8 q-3 -3 0 -8 z" />
        <!-- juggling balls: cascaded in arcs between the raised hands -->
        <g class="prop prop-juggle">
          <circle class="ball ball1" cx="62" cy="63" r="3.6" />
          <circle class="ball ball2" cx="62" cy="63" r="3.6" />
          <circle class="ball ball3" cx="62" cy="63" r="3.6" />
        </g>
        <!-- balloon on a string -->
        <g class="prop prop-balloon">
          <line class="balloon-string" x1="78" y1="74" x2="80" y2="32" />
          <ellipse class="balloon-body" cx="80" cy="21" rx="9" ry="11" />
          <path class="balloon-knot" d="M80 32 l-2 3 h4 z" />
        </g>
        <!-- spinning top -->
        <g class="prop prop-top">
          <polygon class="top-body" points="45,104 55,104 50,115" />
          <ellipse class="top-cap" cx="50" cy="104" rx="5" ry="1.6" />
          <line class="top-stem" x1="50" y1="99" x2="50" y2="104" />
        </g>
        <!-- coffee cup with steam -->
        <g class="prop prop-coffee">
          <path class="steam s1" d="M63 42 q2 -3 0 -6" />
          <path class="steam s2" d="M67 42 q2 -3 0 -6" />
          <rect class="cup" x="59" y="44" width="10" height="9" rx="1.5" />
          <path class="cup-handle" d="M69 46 q4 0 4 3.5 q0 3.5 -4 3.5" />
        </g>
        <!-- open book -->
        <g class="prop prop-book">
          <path class="book-pages" d="M35 84 q7.5 -3 15 0 q7.5 -3 15 0 v12 q-7.5 -3 -15 0 q-7.5 -3 -15 0 z" />
          <line class="book-spine" x1="50" y1="84" x2="50" y2="96" />
        </g>
        <!-- floating gears -->
        <g class="prop prop-gears">
          <g class="gear gear1" transform="translate(84 30)">
            <g class="cogspin">
              <circle class="cog" r="5" />
              <circle class="hub" r="1.6" />
            </g>
          </g>
          <g class="gear gear2" transform="translate(91 41)">
            <g class="cogspin">
              <circle class="cog" r="3.6" />
              <circle class="hub" r="1.2" />
            </g>
          </g>
        </g>
        <!-- charging battery (worn on the robot's chest) -->
        <g class="prop prop-battery">
          <rect class="batt-body" x="40" y="70" width="20" height="9" rx="1.5" />
          <rect class="batt-tip" x="60" y="72.5" width="2.5" height="4" rx="1" />
          <rect class="batt-fill" x="42" y="72" width="4" height="5" rx="0.8" />
          <path class="batt-bolt" d="M51 71 l-3.5 4 h2.5 l-2 3.5 5 -5 h-2.5 z" />
        </g>
        <!-- antenna signal: broadcast waves fanning up from the bulb -->
        <g class="prop prop-signal">
          <path class="sig sig1" d="M45 7 a5 5 0 0 1 10 0" />
          <path class="sig sig2" d="M45 7 a5 5 0 0 1 10 0" />
          <path class="sig sig3" d="M45 7 a5 5 0 0 1 10 0" />
          <path class="sig sig4" d="M45 7 a5 5 0 0 1 10 0" />
        </g>
        <!-- antenna firework: a rocket launches from the bulb and bursts into a
             colorful star of rays tipped with glowing sparks -->
        <g class="prop prop-firework">
          <circle class="fw-rocket" cx="50" cy="7" r="1.8" />
          <g class="fw-burst">
            <g class="fw-rays">
              <line x1="50" y1="-4" x2="50" y2="-16" />
              <line x1="50" y1="-4" x2="58" y2="-12" />
              <line x1="50" y1="-4" x2="62" y2="-4" />
              <line x1="50" y1="-4" x2="58" y2="4" />
              <line x1="50" y1="-4" x2="50" y2="8" />
              <line x1="50" y1="-4" x2="42" y2="4" />
              <line x1="50" y1="-4" x2="38" y2="-4" />
              <line x1="50" y1="-4" x2="42" y2="-12" />
            </g>
            <g class="fw-sparks">
              <circle class="spark s1" cx="50" cy="-16" r="1.7" />
              <circle class="spark s2" cx="58" cy="-12" r="1.7" />
              <circle class="spark s3" cx="62" cy="-4" r="1.7" />
              <circle class="spark s4" cx="58" cy="4" r="1.7" />
              <circle class="spark s1" cx="50" cy="8" r="1.7" />
              <circle class="spark s2" cx="42" cy="4" r="1.7" />
              <circle class="spark s3" cx="38" cy="-4" r="1.7" />
              <circle class="spark s4" cx="42" cy="-12" r="1.7" />
            </g>
          </g>
        </g>
      </svg>
      <div id="caption" class="caption"></div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
